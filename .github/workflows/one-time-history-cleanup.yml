name: One-time TA Guides history archive and branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-history-cleanup.yml"

permissions:
  contents: write

jobs:
  archive-and-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag exact original commit and remove only known merged branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAPSHOT="23384fdafa8439f8c93945c6de1e6c247247ad88"
          TAG="pre-merge-2026-10-27"
          git cat-file -e "${SNAPSHOT}^{commit}"
          existing=$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)
          if [ -z "$existing" ]; then
            git tag -a "$TAG" "$SNAPSHOT" -m "Original Repo Guidance before the 27 October TA Guides consolidation"
            git push origin "refs/tags/${TAG}"
          else
            echo "Tag already exists; leaving unchanged."
          fi
          remove_if_unchanged() {
            branch="$1"
            expected="$2"
            actual=$(git ls-remote origin "refs/heads/${branch}" | cut -f1)
            if [ -z "$actual" ]; then
              echo "Branch ${branch} already absent."
            elif [ "$actual" = "$expected" ]; then
              git push origin --delete "$branch"
            else
              echo "Not deleting changed branch ${branch}: expected ${expected}, found ${actual}." >&2
              exit 1
            fi
          }
          remove_if_unchanged "refactor/consolidate-guides-261027" "ce7bfbbf0f70726a678db17dd47b644d58e54ae1"
          remove_if_unchanged "site/github-pages-261027" "7f88b907ab83132335c78e4ce4e4a50b5b39ff16"
          echo "Archive tag and branch cleanup complete."
